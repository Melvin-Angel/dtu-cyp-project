# @package _global_
# Pretrained Atom-JEPA encoder + readout head, fine-tuned end to end.
defaults:
  - override /readout: mlp

model:
  name: atom_jepa
  type: atom_jepa
  checkpoint: molecules   # Released encoder name or local checkpoint path
  precision: fp32         # bf16 is faster on L40s/A100 but emulated (slower) on V100
  freeze_encoder: false   # true trains only the readout head, for the whole run
  unfreeze_epoch: 0       # 0 disables staging; N > 1 trains the readout alone until epoch N
  encoder_lr: 1.0e-5
  readout_lr: 1.0e-3
  sample_conformers: false  # Training: draw a random conformer each time a molecule is seen
  eval_conformers: 1        # Validation/test: average predictions over this many conformers

train:
  epochs: 20
  batch_size: 8
  weight_decay: 1.0e-4
  grad_clip: 1.0
